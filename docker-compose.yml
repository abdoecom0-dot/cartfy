services:
  postgres:
    image: postgres:16-alpine
    container_name: cartfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartfy
      POSTGRES_USER: cartfy
      POSTGRES_PASSWORD: cartfy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  pg_data:
